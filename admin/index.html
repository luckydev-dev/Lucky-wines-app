<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>LuckyWine Admin - Merchant Portal</title>
    <style>
      :root {
        --color-teal: #4AB7B6;
        --color-orange: #FDAA5D;
        --color-coral: #EA7173;
        --color-bg: #F4F9F9;
        --color-surface: #FFFFFF;
        --color-text-main: #1E293B;
        --color-text-sub: #64748B;
        --safe-top: max(env(safe-area-inset-top, 8px), 10px);
        --safe-bottom: max(env(safe-area-inset-bottom, 12px), 12px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        font-family: 'DM Sans', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      h1, h2, h3, h4, h5, h6, .font-heading {
        font-family: 'Poppins', sans-serif;
      }
      body {
        background-color: var(--color-bg);
        color: var(--color-text-main);
        min-height: 100vh;
        overflow-x: hidden;
      }
      .app-header-safe {
        padding-top: var(--safe-top) !important;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
