<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="adminBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E191C"/>
      <stop offset="50%" stop-color="#120E10"/>
      <stop offset="100%" stop-color="#080607"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCEBA4"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997D20"/>
    </linearGradient>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="128" fill="url(#adminBg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Stylized Wine Bottle & Goblet Emblem -->
  <g transform="translate(146, 100)">
    <!-- Wine Bottle -->
    <path d="M70 20 L90 20 L90 60 L120 100 L120 230 L40 230 L40 100 L70 60 Z" fill="#6E0F2B" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M70 20 L90 20 L90 32 L70 32 Z" fill="url(#goldGrad)"/>
    <rect x="52" y="120" width="56" height="60" rx="4" fill="#151113" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M72 135 L72 165 L92 165" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Wine Glass Silhouette Overlapping -->
    <path d="M110 130 C110 180 170 180 170 130 Z" fill="#8C1438" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M140 180 L140 230" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <path d="M120 230 L160 230" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Admin Badge Banner -->
  <g transform="translate(106, 350)">
    <rect x="0" y="0" width="300" height="48" rx="24" fill="#8C1438" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Lock / Shield Icon -->
    <circle cx="36" cy="24" r="14" fill="url(#goldGrad)"/>
    <path d="M32 23 L32 20 C32 17.8 33.8 16 36 16 C38.2 16 40 17.8 40 20 L40 23" stroke="#2A0510" stroke-width="2" fill="none"/>
    <rect x="30" y="22" width="12" height="9" rx="1.5" fill="#2A0510"/>
    <text x="160" y="30" font-family="'Cinzel', 'Playfair Display', serif, Georgia" font-size="18" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">STORE MANAGER</text>
  </g>

  <!-- Title Text -->
  <text x="256" y="440" font-family="'Cinzel', 'Playfair Display', serif, Georgia" font-size="28" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">LUCKY WINE</text>
  <text x="256" y="468" font-family="sans-serif" font-size="13" font-weight="600" fill="#EAE2D9" text-anchor="middle" letter-spacing="4">ADMIN PORTAL</text>
</svg>
