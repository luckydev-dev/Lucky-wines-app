<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>LuckyWine - Online Drinks &amp; Spirits</title>
    <style>
      :root {
        --color-wine-900: #3D0717;
        --color-wine-700: #720D2B;
        --color-wine-600: #8C1438;
        --color-wine-500: #A81C45;
        --color-gold-500: #D4AF37;
        --color-gold-400: #E5C454;
        --color-gold-100: #FCF6DC;
        --color-bg: #FDFBF9;
        --color-surface: #FFFFFF;
        --color-surface-subtle: #F8F3EE;
        --color-border: #EFE7E1;
        --color-text-main: #1A1114;
        --color-text-sub: #66555C;
        --color-text-muted: #99858D;
        /* Compatibility aliases mapped to wine & gold */
        --color-teal: #720D2B;
        --color-orange: #D4AF37;
        --color-coral: #A81C45;
        --safe-top: max(env(safe-area-inset-top, 8px), 10px);
        --safe-bottom: max(env(safe-area-inset-bottom, 12px), 12px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        font-family: 'DM Sans', 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      h1, h2, h3, h4, h5, h6, .font-heading {
        font-family: 'Poppins', sans-serif;
      }
      body {
        background-color: var(--color-bg);
        color: var(--color-text-main);
        min-height: 100vh;
        overflow-x: hidden;
      }
      .app-header-safe {
        padding-top: var(--safe-top) !important;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
